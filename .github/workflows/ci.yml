name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project tests/CaptionChecks -c Release
      - run: dotnet run --project tests/LayoutProbe -c Release -- artifacts/layout
      - shell: pwsh
        run: ./scripts/Build.ps1 -SelfContained
      - shell: pwsh
        run: ./scripts/Build-Installer.ps1 -PayloadDirectory dist/LiveSubtitles
      - name: Exercise download progress, window controls, cancellation and resume
        run: python tests/Installer/progress_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitles-windows-x64
          path: dist/LiveSubtitles-Setup-*-windows-x64.exe
          if-no-files-found: error
