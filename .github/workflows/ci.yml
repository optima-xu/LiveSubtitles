name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project tests/CaptionChecks -c Release
      - run: dotnet run --project tests/LayoutProbe -c Release -- artifacts/layout
      - shell: pwsh
        run: ./scripts/Build.ps1 -SelfContained
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitles-windows-x64
          path: dist/LiveSubtitles/
