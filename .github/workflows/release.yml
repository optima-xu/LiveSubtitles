name: Release Windows build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet run --project tests/CaptionChecks -c Release
      - run: dotnet run --project tests/LayoutProbe -c Release -- artifacts/layout
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content src/LiveSubtitles/LiveSubtitles.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match the application version.' }
          ./scripts/Build.ps1 -SelfContained
          ./scripts/Build-Installer.ps1 -PayloadDirectory dist/LiveSubtitles -OutputDirectory .
          $archive = "LiveSubtitles-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path dist/LiveSubtitles/* -DestinationPath $archive
          $setup = "LiveSubtitles-Setup-$env:GITHUB_REF_NAME-windows-x64.exe"
          @($setup, $archive) | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -LiteralPath SHA256SUMS.txt -Encoding utf8
      - name: Install, launch, upgrade and uninstall in a custom folder
        timeout-minutes: 45
        shell: pwsh
        run: ./tests/Installer/SmokeTest.ps1 -InstallerPath "./LiveSubtitles-Setup-$env:GITHUB_REF_NAME-windows-x64.exe"
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "LiveSubtitles-Setup-$env:GITHUB_REF_NAME-windows-x64.exe" "LiveSubtitles-$env:GITHUB_REF_NAME-windows-x64.zip" SHA256SUMS.txt --verify-tag --draft --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
